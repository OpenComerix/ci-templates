stages:
  - validate
  - test
  - build

variables:
  PNPM_VERSION: "12.4.2"
  PNPM_STORE_DIR: .pnpm-store

.opencomerix:node-pnpm:
  image: node:24.21.0-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare "pnpm@${PNPM_VERSION}" --activate
    - pnpm config set store-dir "${PNPM_STORE_DIR}"
    - pnpm install --frozen-lockfile

quality:format:
  extends: .opencomerix:node-pnpm
  stage: validate
  script:
    - pnpm format:check

quality:lint:
  extends: .opencomerix:node-pnpm
  stage: validate
  script:
    - pnpm lint

quality:typecheck:
  extends: .opencomerix:node-pnpm
  stage: validate
  script:
    - pnpm typecheck

test:unit:
  extends: .opencomerix:node-pnpm
  stage: test
  script:
    - pnpm test:unit
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/

build:application:
  extends: .opencomerix:node-pnpm
  stage: build
  script:
    - pnpm build
  artifacts:
    expire_in: 7 days
    paths:
      - dist/
