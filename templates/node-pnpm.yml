stages:
  - validate
  - test
  - build

variables:
  PNPM_VERSION: "12.4.2"
  PNPM_STORE_DIR: .pnpm-store
  PNPM_CACHE_POLICY: pull
  COREPACK_HOME: $CI_PROJECT_DIR/.corepack-cache

.opencomerix:node-pnpm:
  image: node:24.21.0-bookworm-slim
  interruptible: true
  cache:
    key:
      prefix: node24.21.0-pnpm12.4.2-bookworm-v1
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - .corepack-cache/
    policy: $PNPM_CACHE_POLICY
  before_script:
    - corepack enable
    - corepack prepare "pnpm@${PNPM_VERSION}" --activate
    - pnpm config set store-dir "${PNPM_STORE_DIR}"
    - pnpm install --frozen-lockfile --prefer-offline

quality:format:
  extends: .opencomerix:node-pnpm
  stage: validate
  variables:
    PNPM_CACHE_POLICY: pull-push
  script:
    - pnpm format:check

quality:lint:
  extends: .opencomerix:node-pnpm
  stage: validate
  script:
    - pnpm lint

quality:typecheck:
  extends: .opencomerix:node-pnpm
  stage: validate
  script:
    - pnpm typecheck

test:unit:
  extends: .opencomerix:node-pnpm
  stage: test
  dependencies: []
  script:
    - pnpm test:unit
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/

test:e2e:
  extends: .opencomerix:node-pnpm
  stage: test
  dependencies: []
  rules:
    - exists:
        - test/**/*.e2e-spec.ts
  script:
    - pnpm test:e2e

build:application:
  extends: .opencomerix:node-pnpm
  stage: build
  script:
    - pnpm build
  artifacts:
    expire_in: 7 days
    paths:
      - dist/
