# GitHub Actions migration; original job commands and artifact edges preserved.
name: OpenComerix CI
on:
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  validate_yaml:
    name: validate:yaml
    runs-on: ubuntu-24.04
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.13.7
      - name: Restore exact pip cache
        id: pip_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pip-cache/
          key: python3.13.7-ubuntu24.04-pyyaml6.0.2-v1
      - name: Prepare job
        run: pip install PyYAML==6.0.2
      - name: Run original validation commands
        run: |-
          python scripts/validate_yaml.py
          python -m unittest discover -s test -p 'test_*.py'
      - name: Save exact pip cache
        if: success() && steps.pip_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pip-cache/
          key: python3.13.7-ubuntu24.04-pyyaml6.0.2-v1
