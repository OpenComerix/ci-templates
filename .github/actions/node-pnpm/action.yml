name: Frozen Node and pnpm setup
description: Pinned tools, dependency cache restore and frozen installation.
inputs:
  install-mode:
    description: normal or ignore-scripts
    default: normal
outputs:
  cache-key:
    description: Exact dependency cache key
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-hit:
    description: Exact cache hit
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Verify Node
      shell: bash
      run: test "$(node --version)" = v24.21.0
    - name: Restore dependency cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          .pnpm-store/
          .corepack-cache/
        key: node24.21.0-pnpm12.4.2-bookworm-v1-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Prepare pinned pnpm
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@12.4.2 --activate
        test "$(pnpm --version)" = 12.4.2
        pnpm config set store-dir .pnpm-store
    - name: Install frozen dependencies
      shell: bash
      env:
        INSTALL_MODE: ${{ inputs.install-mode }}
      run: |
        case "$INSTALL_MODE" in
          normal) pnpm install --frozen-lockfile --prefer-offline ;;
          ignore-scripts) pnpm install --frozen-lockfile --ignore-scripts --prefer-offline ;;
          *) echo 'Unknown installation mode' >&2; exit 1 ;;
        esac
